media:
  input: public/uploads
  output: /uploads
  path: "{{year}}/{{month}}"

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{fields.slug}"
    view:
      fields: [title, publishedAt, featured]
      primary: title
      sort: [publishedAt, desc]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: techStack
        label: Tech Stack
        type: string
        list: true
        required: true
      - name: coverImage
        label: Cover Image
        type: image
        required: true
      - name: videoUrl
        label: Video URL
        type: string
      - name: githubUrl
        label: GitHub URL
        type: string
        required: true
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: publishedAt
        label: Published At
        type: date
        required: true
      - name: body
        label: Content
        type: rich-text
