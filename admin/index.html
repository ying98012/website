<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio CMS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #131313;
        color: #e5e2e1;
        font-family: Inter, sans-serif;
      }
      .wrap {
        width: min(760px, 92vw);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.03);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      a {
        color: #00d2fd;
        text-decoration: none;
        border: 1px solid rgba(0, 210, 253, 0.4);
        border-radius: 8px;
        padding: 10px 14px;
      }
      a:hover {
        background: rgba(0, 210, 253, 0.12);
      }
      code {
        color: #edb1ff;
      }
    </style>
  </head>
  <body>
    <section class="wrap">
      <h1>CMS 管理入口</h1>
      <p>
        目前採用 Pages CMS + Git-backed 流程，內容設定檔在
        <code>admin/config.yml</code>，資料目錄在
        <code>src/content/projects</code>。
      </p>
      <div class="actions">
        <a href="https://pagescms.org" target="_blank" rel="noreferrer"
          >開啟 Pages CMS</a
        >
        <a href="/admin-dashboard/" target="_blank" rel="noreferrer"
          >開啟內建後台儀表板</a
        >
        <a
          href="https://github.com/ying98012/website/tree/main/src/content/projects"
          target="_blank"
          rel="noreferrer"
          >GitHub 內容目錄</a
        >
      </div>
    </section>
  </body>
</html>
