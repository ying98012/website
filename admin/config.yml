media:
  input: public/uploads
  output: /uploads
  path: "{{year}}/{{month}}"

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{fields.slug}.md"
    view:
      fields: [title, publishedAt, featured]
      primary: title
      sort: [publishedAt, desc]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: techStack
        label: Tech Stack
        type: string
        list: true
        required: true
      - name: coverImage
        label: Cover Image
        type: image
        required: true
      - name: coverAspect
        label: Cover Aspect
        type: select
        default: square
        options:
          values:
            - label: 正方形
              value: square
            - label: 直式
              value: portrait
            - label: 橫式
              value: landscape
      - name: screenshots
        label: Screenshots
        type: image
        options:
          multiple:
            max: 20
          unique: true
      - name: videoUrl
        label: Video URL
        type: string
      - name: readmeUrls
        label: README URLs
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: publishedAt
        label: Published At
        type: date
        required: true
      - name: body
        label: Content
        type: rich-text

  - name: homePage
    label: Home Page
    type: file
    path: src/content/home-page/content.md
    fields:
      - name: heroTitle
        label: Hero Title
        type: string
        required: true
      - name: heroDescription
        label: Hero Description
        type: text
        required: true
      - name: primaryButtonLabel
        label: Primary Button Label
        type: string
        required: true
      - name: primaryButtonUrl
        label: Primary Button URL
        type: string
        required: true
      - name: secondaryButtonLabel
        label: Secondary Button Label
        type: string
        required: true
      - name: secondaryButtonUrl
        label: Secondary Button URL
        type: string
        required: true
      - name: projectsTitle
        label: Projects Title
        type: string
        required: true
      - name: projectsDescription
        label: Projects Description
        type: string
        required: true
      - name: body
        label: Notes
        type: rich-text

  - name: experiencePage
    label: Experience Page
    type: file
    path: src/content/experience-page/content.md
    fields:
      - name: pageTitle
        label: Page Title
        type: string
        required: true
      - name: pageDescription
        label: Page Description
        type: text
        required: true
      - name: timeline
        label: Timeline
        type: object
        list: true
        fields:
          - name: period
            label: Period
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: company
            label: Company
            type: string
            required: true
          - name: highlights
            label: Highlights
            type: string
            list: true
            required: true
          - name: tech
            label: Tech Stack
            type: string
            list: true
            required: true
      - name: body
        label: Notes
        type: rich-text

  - name: stackPage
    label: Stack Page
    type: file
    path: src/content/stack-page/content.md
    fields:
      - name: pageTitle
        label: Page Title
        type: string
        required: true
      - name: pageDescription
        label: Page Description
        type: text
        required: true
      - name: coreSkills
        label: Core Skills
        type: object
        list: true
        fields:
          - name: name
            label: Skill Name
            type: string
            required: true
          - name: level
            label: Skill Level (0-100)
            type: number
            required: true
      - name: tools
        label: Tools
        type: string
        list: true
        required: true
      - name: foundations
        label: Foundations
        type: string
        list: true
        required: true
      - name: focusLabel
        label: Focus Label
        type: string
        required: true
      - name: focusDescription
        label: Focus Description
        type: text
        required: true
      - name: body
        label: Notes
        type: rich-text

  - name: contactPage
    label: Contact Page
    type: file
    path: src/content/contact-page/content.md
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: pageDescription
        label: Page Description
        type: text
        required: true
      - name: socialLinks
        label: Social Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: contactEmailLabel
        label: Contact Email Label
        type: string
        required: true
      - name: contactEmail
        label: Contact Email
        type: string
        required: true
      - name: responseHint
        label: Response Hint
        type: string
        required: true
      - name: body
        label: Notes
        type: rich-text
